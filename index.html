<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Markdown 文档生成器</title>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>
/* =========================================================
 *  1. 设计变量（浅色 / 深色）
 * =======================================================*/
:root {
  --bg:            #ffffff;
  --bg-soft:       #f6f8fa;
  --bg-elev:       #ffffff;
  --fg:            #1f2328;
  --fg-muted:      #59636e;
  --border:        #d1d9e0;
  --border-soft:   #e5e9ee;
  --accent:        #0969da;
  --accent-soft:   rgba(9, 105, 218, .09);
  --code-bg:       rgba(129, 139, 152, .12);
  --pre-bg:        #f6f8fa;
  --danger:        #cf222e;
  --danger-soft:   rgba(207, 34, 46, .09);
  --shadow:        0 1px 3px rgba(0, 0, 0, .06);

  --hl-comment:  #6e7781;
  --hl-keyword:  #cf222e;
  --hl-string:   #0a3069;
  --hl-number:   #0550ae;
  --hl-function: #8250df;
  --hl-attr:     #953800;
  --hl-builtin:  #0550ae;
  --hl-meta:     #6e7781;

  --adm-note:      #0969da;  --adm-note-bg:      #ddf4ff;
  --adm-tip:       #1a7f37;  --adm-tip-bg:       #dafbe1;
  --adm-important: #8250df;  --adm-important-bg: #f5f0ff;
  --adm-warning:   #9a6700;  --adm-warning-bg:   #fff8c5;
  --adm-caution:   #cf222e;  --adm-caution-bg:   #ffebe9;
}

[data-theme="dark"] {
  --bg:            #0d1117;
  --bg-soft:       #151b23;
  --bg-elev:       #0d1117;
  --fg:            #e6edf3;
  --fg-muted:      #9198a1;
  --border:        #3d444d;
  --border-soft:   #2a313a;
  --accent:        #4493f8;
  --accent-soft:   rgba(68, 147, 248, .12);
  --code-bg:       rgba(101, 108, 118, .25);
  --pre-bg:        #151b23;
  --danger:        #f85149;
  --danger-soft:   rgba(248, 81, 73, .12);
  --shadow:        0 1px 3px rgba(0, 0, 0, .4);

  --hl-comment:  #8b949e;
  --hl-keyword:  #ff7b72;
  --hl-string:   #a5d6ff;
  --hl-number:   #79c0ff;
  --hl-function: #d2a8ff;
  --hl-attr:     #ffa657;
  --hl-builtin:  #79c0ff;
  --hl-meta:     #8b949e;

  --adm-note:      #4493f8;  --adm-note-bg:      rgba(56, 139, 253, .10);
  --adm-tip:       #3fb950;  --adm-tip-bg:       rgba(63, 185, 80, .10);
  --adm-important: #ab7df8;  --adm-important-bg: rgba(171, 125, 248, .10);
  --adm-warning:   #d29922;  --adm-warning-bg:   rgba(210, 153, 34, .10);
  --adm-caution:   #f85149;  --adm-caution-bg:   rgba(248, 81, 73, .10);
}

/* =========================================================
 *  2. 基础布局
 * =======================================================*/
* { box-sizing: border-box; }

html, body { height: 100%; margin: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans",
               Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
  font-size: 14px;
  background: var(--bg);
  color: var(--fg);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

/* ---------- 顶栏 ---------- */
.topbar {
  flex: 0 0 auto;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-elev);
}

.brand { display: flex; align-items: center; gap: 10px; }

.brand-mark {
  display: grid;
  place-items: center;
  width: 28px; height: 28px;
  border-radius: 7px;
  background: var(--accent);
  color: #fff;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: -.5px;
}

.brand-name { font-weight: 600; font-size: 14.5px; }

/* ---------- 主区域 ---------- */
.layout { flex: 1 1 auto; display: flex; min-height: 0; }

.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.pane-editor  { flex: 0 0 46%; border-right: 1px solid var(--border); }
.pane-preview { flex: 1 1 0; background: var(--bg); }

.pane-head {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 9px 14px;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--fg-muted);
  background: var(--bg-soft);
  border-bottom: 1px solid var(--border);
}

.pane-body { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; min-height: 0; }

.pane-preview .pane-body { scroll-behavior: smooth; }

.pane-body::-webkit-scrollbar { width: 10px; height: 10px; }
.pane-body::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 6px;
  border: 2px solid var(--bg);
}
.pane-body::-webkit-scrollbar-track { background: transparent; }

/* ---------- 底栏 ---------- */
.bottombar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 16px;
  border-top: 1px solid var(--border);
  background: var(--bg-elev);
}
.spacer { flex: 1 1 auto; }

/* =========================================================
 *  3. 通用控件
 * =======================================================*/
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7px 14px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  color: var(--fg);
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 7px;
  cursor: pointer;
  transition: background .15s, border-color .15s, color .15s;
  white-space: nowrap;
}
.btn:hover  { background: var(--bg-soft); border-color: var(--fg-muted); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.btn.primary {
  color: #fff;
  background: var(--accent);
  border-color: transparent;
}
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }

.btn.danger { color: var(--danger); border-color: var(--border); }
.btn.danger:hover { background: var(--danger-soft); border-color: var(--danger); }

.btn.tiny { padding: 4px 9px; font-size: 12px; border-radius: 6px; }

.btn-icon {
  display: grid;
  place-items: center;
  width: 24px; height: 24px;
  padding: 0;
  font-size: 12px;
  color: var(--fg-muted);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  cursor: pointer;
  transition: .15s;
}
.btn-icon:hover { color: var(--fg); background: var(--bg-elev); border-color: var(--border); }
.btn-icon.danger:hover { color: var(--danger); background: var(--danger-soft); border-color: var(--danger); }

.input {
  width: 100%;
  padding: 6px 9px;
  font-family: inherit;
  font-size: 13px;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input::placeholder { color: var(--fg-muted); opacity: .7; }

.textarea {
  resize: none;
  min-height: 62px;
  line-height: 1.6;
  overflow: hidden;
}

.select { cursor: pointer; }

.stack { display: flex; flex-direction: column; gap: 8px; }
.row   { display: flex; gap: 8px; align-items: center; }
.row > .select { flex: 0 0 120px; }

.field {
  display: grid;
  grid-template-columns: 76px minmax(0, 1fr);
  align-items: center;
  gap: 8px;
}
.field-label { font-size: 12px; color: var(--fg-muted); }

.hint { font-size: 12px; color: var(--fg-muted); }

/* 分段控件 */
.seg {
  display: inline-flex;
  padding: 2px;
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: 7px;
  align-self: flex-start;
}
.seg-btn {
  padding: 4px 12px;
  font-family: inherit;
  font-size: 12.5px;
  color: var(--fg-muted);
  background: transparent;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  transition: .15s;
}
.seg-btn.active { color: var(--fg); background: var(--bg-elev); box-shadow: var(--shadow); }

/* =========================================================
 *  4. 组件面板（Palette）
 * =======================================================*/
.palette {
  flex: 0 0 auto;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 10px 12px;
  background: var(--bg-soft);
  border-bottom: 1px solid var(--border);
}

.pal-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  font-family: inherit;
  font-size: 13px;
  color: var(--fg);
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 7px;
  cursor: pointer;
  transition: .15s;
  white-space: nowrap;
}
.pal-btn:hover {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-soft);
}
.pal-btn .ico { font-size: 14px; line-height: 1; }

/* =========================================================
 *  5. 编辑卡片
 * =======================================================*/
.card {
  margin: 10px 12px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 9px;
  overflow: hidden;
  transition: border-color .15s, box-shadow .15s;
}
.card:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 6px 5px 10px;
  background: var(--bg-soft);
  border-bottom: 1px solid var(--border-soft);
}

.card-badge {
  display: grid;
  place-items: center;
  min-width: 20px; height: 20px;
  padding: 0 4px;
  font-size: 12px;
  line-height: 1;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 5px;
}

.card-title { flex: 1 1 auto; font-size: 12.5px; font-weight: 600; color: var(--fg-muted); }
.card-actions { display: flex; gap: 2px; }
.card-body { padding: 10px; }

/* 空状态 */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 60px 20px;
  color: var(--fg-muted);
  text-align: center;
}
.empty-icon { font-size: 32px; opacity: .55; margin-bottom: 6px; }
.empty p { margin: 0; font-size: 13.5px; }
.empty .muted { font-size: 12.5px; opacity: .75; }

/* =========================================================
 *  6. 表格编辑器（网格 + 链接）
 * =======================================================*/
.table-editor { overflow-x: auto; margin: 0 -2px; }

.te-table {
  width: 100%;
  min-width: 260px;
  border-collapse: collapse;
  font-size: 13px;
  table-layout: auto;
}
.te-table th,
.te-table td {
  border: 1px solid var(--border);
  padding: 0;
  vertical-align: middle;
}
.te-table th { background: var(--bg-soft); }

.te-cell {
  display: block;
  width: 100%;
  min-width: 60px;
  border: none;
  outline: none;
  padding: 7px 10px;
  background: transparent;
  font: inherit;
  color: var(--fg);
  border-radius: 0;
}
.te-cell:focus { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.te-cell::placeholder { color: var(--fg-muted); opacity: .6; }
.te-table th .te-cell { font-weight: 600; }

.te-row-del {
  width: 38px;
  text-align: center;
  background: var(--bg-soft);
}
.te-row-del .btn-icon { display: inline-flex; margin: 2px; }

.te-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.te-hint {
  margin-top: 6px;
  font-size: 12px;
  color: var(--fg-muted);
  line-height: 1.5;
}
.te-hint code {
  padding: 1px 5px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11.5px;
  background: var(--code-bg);
  border-radius: 4px;
}

/* =========================================================
 *  7. Markdown 预览（GitHub / MkDocs 风格）
 * =======================================================*/
.markdown-body {
  max-width: 900px;
  margin: 0 auto;
  padding: 28px 34px 100px;
  font-size: 15px;
  line-height: 1.72;
  color: var(--fg);
  word-wrap: break-word;
}

.markdown-body > *:first-child { margin-top: 0 !important; }
.markdown-body > *:last-child  { margin-bottom: 0 !important; }

.markdown-body h1,
.markdown-body h2,
.markdown-body h3,
.markdown-body h4,
.markdown-body h5,
.markdown-body h6 {
  margin: 1.6em 0 .65em;
  font-weight: 600;
  line-height: 1.3;
  scroll-margin-top: 12px;
}

.markdown-body h1 { font-size: 2em;    padding-bottom: .3em; border-bottom: 1px solid var(--border); }
.markdown-body h2 { font-size: 1.5em;  padding-bottom: .3em; border-bottom: 1px solid var(--border); }
.markdown-body h3 { font-size: 1.25em; }
.markdown-body h4 { font-size: 1em; }

.markdown-body p { margin: 0 0 1em; }

.markdown-body a { color: var(--accent); text-decoration: none; }
.markdown-body a:hover { text-decoration: underline; }

.markdown-body img {
  max-width: 100%;
  border-radius: 8px;
  border: 1px solid var(--border-soft);
  background: var(--bg-soft);
}

.markdown-body ul,
.markdown-body ol { margin: 0 0 1em; padding-left: 1.9em; }
.markdown-body li { margin: .3em 0; }
.markdown-body li > p { margin: .3em 0; }

.markdown-body hr {
  height: 1px;
  margin: 2em 0;
  padding: 0;
  border: 0;
  background: var(--border);
}

.markdown-body blockquote {
  margin: 1em 0;
  padding: 0 1em;
  color: var(--fg-muted);
  border-left: .25em solid var(--border);
}
.markdown-body blockquote > :first-child { margin-top: 0; }
.markdown-body blockquote > :last-child  { margin-bottom: 0; }

/* 表格 */
.markdown-body table {
  display: block;
  width: max-content;
  max-width: 100%;
  margin: 1em 0;
  overflow: auto;
  border-collapse: collapse;
  border-spacing: 0;
  font-size: 14px;
}
.markdown-body th,
.markdown-body td {
  padding: 7px 13px;
  border: 1px solid var(--border);
}
.markdown-body th { font-weight: 600; background: var(--bg-soft); }
.markdown-body tbody tr:nth-child(2n) td { background: var(--bg-soft); }

/* 行内代码 & 代码块 */
.markdown-body code {
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
               "Liberation Mono", monospace;
  font-size: .86em;
  padding: .18em .4em;
  background: var(--code-bg);
  border-radius: 6px;
}
.markdown-body pre {
  margin: 1em 0;
  padding: 14px 16px;
  overflow: auto;
  background: var(--pre-bg);
  border: 1px solid var(--border-soft);
  border-radius: 8px;
  line-height: 1.6;
}
.markdown-body pre code {
  padding: 0;
  font-size: 13px;
  background: transparent;
  border-radius: 0;
}

/* highlight.js token 配色 */
.hljs-comment, .hljs-quote               { color: var(--hl-comment); font-style: italic; }
.hljs-keyword, .hljs-selector-tag,
.hljs-literal, .hljs-type, .hljs-doctag  { color: var(--hl-keyword); }
.hljs-string, .hljs-regexp, .hljs-addition { color: var(--hl-string); }
.hljs-number, .hljs-symbol,
.hljs-bullet, .hljs-link                 { color: var(--hl-number); }
.hljs-title, .hljs-section, .hljs-name,
.hljs-title.function_                    { color: var(--hl-function); }
.hljs-attr, .hljs-attribute, .hljs-variable,
.hljs-template-variable, .hljs-property  { color: var(--hl-attr); }
.hljs-built_in, .hljs-class .hljs-title { color: var(--hl-builtin); }
.hljs-meta                               { color: var(--hl-meta); }
.hljs-emphasis { font-style: italic; }
.hljs-strong   { font-weight: 700; }

/* 提示框（GitHub Alerts 风格） */
.admonition {
  margin: 1em 0;
  padding: 10px 16px 12px;
  border-left: 4px solid var(--adm-color);
  border-radius: 7px;
  background: var(--adm-bg);
  color: var(--fg);
}
.admonition-title {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 5px;
  font-weight: 600;
  font-size: 14.5px;
  color: var(--adm-color);
}
.admonition-body > :first-child { margin-top: 0; }
.admonition-body > :last-child  { margin-bottom: 0; }

.admonition.note      { --adm-color: var(--adm-note);      --adm-bg: var(--adm-note-bg); }
.admonition.tip       { --adm-color: var(--adm-tip);       --adm-bg: var(--adm-tip-bg); }
.admonition.important { --adm-color: var(--adm-important); --adm-bg: var(--adm-important-bg); }
.admonition.warning   { --adm-color: var(--adm-warning);   --adm-bg: var(--adm-warning-bg); }
.admonition.caution   { --adm-color: var(--adm-caution);   --adm-bg: var(--adm-caution-bg); }

/* 折叠面板 */
.markdown-body details {
  margin: 1em 0;
  padding: 10px 16px;
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.markdown-body summary {
  font-weight: 600;
  cursor: pointer;
  user-select: none;
  list-style: none;
}
.markdown-body summary::-webkit-details-marker { display: none; }
.markdown-body summary::before {
  content: "▸";
  display: inline-block;
  margin-right: 6px;
  color: var(--fg-muted);
  transition: transform .18s;
}
.markdown-body details[open] > summary::before { transform: rotate(90deg); }
.markdown-body details[open] > summary { margin-bottom: 8px; }

/* 预览空状态 */
.preview-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 55vh;
  padding: 40px;
  font-size: 14px;
  color: var(--fg-muted);
  text-align: center;
}

/* =========================================================
 *  8. 链接插入浮层
 * =======================================================*/
.link-pop {
  position: fixed;
  z-index: 1000;
  width: 290px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 9px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
  animation: popIn .12s ease-out;
}

@keyframes popIn {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}

.link-pop .link-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 12px;
  color: var(--fg-muted);
}

.link-pop .link-hint {
  font-size: 11.5px;
  color: var(--fg-muted);
  line-height: 1.5;
}

.link-pop .link-actions {
  display: flex;
  gap: 6px;
  justify-content: flex-end;
  margin-top: 2px;
}

/* =========================================================
 *  9. Toast
 * =======================================================*/
.toast {
  position: fixed;
  left: 50%;
  bottom: 78px;
  transform: translate(-50%, 12px);
  padding: 9px 18px;
  font-size: 13px;
  color: #fff;
  background: #24292f;
  border-radius: 8px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .22);
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s, transform .22s;
  z-index: 999;
}
[data-theme="dark"] .toast { background: #3d444d; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* =========================================================
 *  10. 响应式
 * =======================================================*/
@media (max-width: 880px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100dvh; }
  .layout { flex-direction: column; }
  .pane-editor  { flex: none; border-right: none; border-bottom: 1px solid var(--border); }
  .pane-preview { flex: none; }
  .pane-editor .pane-body { max-height: 55vh; }
  .markdown-body { padding: 22px 18px 60px; }
  .field { grid-template-columns: 1fr; gap: 4px; }
  .bottombar { position: sticky; bottom: 0; z-index: 10; }
}
</style>
</head>

<body>
<div class="app">

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">M↓</span>
      <span class="brand-name">Markdown 文档生成器</span>
    </div>
    <button class="btn-icon" id="themeToggle" title="切换深色 / 浅色">🌙</button>
  </header>

  <!-- 主区域 -->
  <main class="layout">
    <section class="pane pane-editor">
      <div class="palette" id="palette"></div>
      <div class="pane-body" id="blockList"></div>
    </section>

    <section class="pane pane-preview">
      <div class="pane-head">
        <span>实时预览</span>
      </div>
      <div class="pane-body">
        <article class="markdown-body" id="preview"></article>
      </div>
    </section>
  </main>

  <!-- 底栏 -->
  <footer class="bottombar">
    <button class="btn primary" id="btnCopy">复制 Markdown</button>
    <button class="btn" id="btnDownload">下载 .md</button>
    <span class="spacer"></span>
    <button class="btn danger" id="btnClear">清空内容</button>
  </footer>

</div>

<script>
/* =========================================================================
 *  Markdown 文档生成器
 * ========================================================================= */

/* =========================================================================
 * 1. 工具函数
 * ========================================================================= */

const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, val] of Object.entries(attrs)) {
    if (val === null || val === undefined || val === false) continue;
    if (key === 'class')                     node.className = val;
    else if (key === 'html')                 node.innerHTML = val;
    else if (key === 'text')                 node.textContent = val;
    else if (key.startsWith('on') && typeof val === 'function')
      node.addEventListener(key.slice(2).toLowerCase(), val);
    else node.setAttribute(key, val);
  }
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}

function input(value, onInput, placeholder = '') {
  return el('input', {
    type: 'text',
    class: 'input',
    value: value ?? '',
    placeholder,
    onInput: (e) => onInput(e.target.value),
  });
}

function textarea(value, onInput, placeholder = '', rows = 3) {
  const ta = el('textarea', { class: 'input textarea', placeholder, rows });
  ta.value = value ?? '';
  ta.addEventListener('input', () => { onInput(ta.value); autoGrow(ta); });
  return ta;
}

function autoGrow(ta) {
  ta.style.height = 'auto';
  ta.style.height = Math.max(ta.scrollHeight, 62) + 'px';
}

function select(value, options, onChange) {
  const sel = el('select', { class: 'input select' });
  for (const [val, label] of options) {
    const opt = el('option', { value: val }, label);
    if (String(val) === String(value)) opt.selected = true;
    sel.append(opt);
  }
  sel.addEventListener('change', () => onChange(sel.value));
  return sel;
}

function field(labelText, control) {
  return el('div', { class: 'field' },
    el('span', { class: 'field-label' }, labelText),
    control
  );
}

let toastTimer = null;
function toast(message) {
  let node = $('.toast');
  if (!node) {
    node = el('div', { class: 'toast' });
    document.body.append(node);
  }
  node.textContent = message;
  requestAnimationFrame(() => node.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => node.classList.remove('show'), 1900);
}

/* ---------- 标题 slug（用于锚点） ---------- */
function slugify(text) {
  return String(text ?? '')
    .trim()
    .toLowerCase()
    .replace(/<[^>]*>/g, '')                     // 去 HTML 标签
    .replace(/[^\w\u4e00-\u9fa5\s-]/g, '')       // 保留字母数字中文空格连字符
    .replace(/\s+/g, '-')                        // 空白 → 连字符
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '');
}

/* =========================================================================
 * 2. 链接插入浮层
 * ========================================================================= */

let currentPopover = null;

function closeLinkPopover() {
  if (!currentPopover) return;
  currentPopover.remove();
  currentPopover = null;
  document.removeEventListener('mousedown', onDocMouseDown, true);
  document.removeEventListener('keydown', onDocKeyDown, true);
}

function onDocMouseDown(e) {
  if (!currentPopover) return;
  if (currentPopover.contains(e.target)) return;
  if (e.target.closest && e.target.closest('.link-trigger')) return;
  closeLinkPopover();
}

function onDocKeyDown(e) {
  if (e.key === 'Escape') closeLinkPopover();
}

/**
 * 打开链接插入浮层
 * @param {HTMLElement} anchorBtn 触发按钮（用于定位）
 * @param {(text:string, url:string) => boolean} onInsert 返回 true 表示插入成功
 */
function openLinkPopover(anchorBtn, onInsert) {
  if (currentPopover) closeLinkPopover();

  /* 尝试预填选中文字 */
  let presetText = '';
  const activeEl = document.activeElement;
  if (activeEl && activeEl.classList && activeEl.classList.contains('te-cell')) {
    const s = activeEl.selectionStart ?? 0;
    const e = activeEl.selectionEnd ?? 0;
    if (s !== e) presetText = activeEl.value.slice(s, e);
  }

  const textInput = el('input', {
    type: 'text',
    class: 'input',
    placeholder: '显示的文字（留空则用链接地址）',
    value: presetText,
  });
  const urlInput = el('input', {
    type: 'text',
    class: 'input',
    placeholder: 'https://… 或 #标题',
  });

  const pop = el('div', { class: 'link-pop' },
    el('label', { class: 'link-field' }, '显示文字', textInput),
    el('label', { class: 'link-field' }, '链接地址', urlInput),
    el('div', { class: 'link-hint' },
      '填网页地址（https://…），或填 ',
      el('code', {}, '#标题'),
      ' 跳转到本文档内的标题'
    ),
    el('div', { class: 'link-actions' },
      el('button', { class: 'btn tiny', type: 'button', onClick: closeLinkPopover }, '取消'),
      el('button', {
        class: 'btn tiny primary', type: 'button',
        onClick: () => {
          const text = textInput.value.trim();
          const url  = urlInput.value.trim();
          if (!url) { toast('请填写链接地址'); urlInput.focus(); return; }
          if (onInsert(text, url)) closeLinkPopover();
        },
      }, '插入')
    )
  );

  document.body.append(pop);
  currentPopover = pop;

  /* 定位：优先显示在按钮下方，空间不足时显示在上方 */
  const rect    = anchorBtn.getBoundingClientRect();
  const popRect = pop.getBoundingClientRect();
  let left = rect.left;
  let top  = rect.bottom + 6;
  if (left + popRect.width > window.innerWidth - 8)
    left = window.innerWidth - popRect.width - 8;
  if (top + popRect.height > window.innerHeight - 8)
    top = rect.top - popRect.height - 6;
  if (left < 8) left = 8;
  if (top < 8)  top  = 8;
  pop.style.left = left + 'px';
  pop.style.top  = top  + 'px';

  textInput.focus();
  textInput.select();

  setTimeout(() => {
    document.addEventListener('mousedown', onDocMouseDown, true);
    document.addEventListener('keydown', onDocKeyDown, true);
  }, 0);

  /* Enter 快捷提交 */
  [textInput, urlInput].forEach((inp) => {
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        pop.querySelector('.link-actions .primary').click();
      }
    });
  });
}

/** 把 Markdown 链接插入到 input 的光标位置 */
function insertLinkIntoCell(inputEl, text, url) {
  const s = inputEl.selectionStart ?? inputEl.value.length;
  const e = inputEl.selectionEnd   ?? inputEl.value.length;
  const selected = inputEl.value.slice(s, e);
  const display  = text || selected || url;
  const linkMd   = `[${display}](${url})`;
  inputEl.value  = inputEl.value.slice(0, s) + linkMd + inputEl.value.slice(e);
  inputEl.dispatchEvent(new Event('input', { bubbles: true }));
  inputEl.focus();
  const pos = s + linkMd.length;
  inputEl.setSelectionRange(pos, pos);
}

/* =========================================================================
 * 3. 组件注册表
 * ========================================================================= */

const COMPONENTS = {};

function defineComponent(def) {
  COMPONENTS[def.type] = def;
  return def;
}

/* ---------------------------------------------------------------
 * 3.1 标题
 * ------------------------------------------------------------- */
defineComponent({
  type: 'heading',
  label: '标题',
  icon: '📌',
  create: () => ({ level: 1, text: '' }),
  editor(block, ctx) {
    const d = block.data;
    return el('div', { class: 'row' },
      select(d.level, [
        ['1', '大标题'],
        ['2', '中标题'],
        ['3', '小标题'],
        ['4', '四级标题'],
      ], (v) => ctx.update({ level: Number(v) })),
      input(d.text, (v) => ctx.update({ text: v }), '输入标题文字…')
    );
  },
  toMarkdown(b) {
    const text = (b.data.text || '').trim() || '标题';
    return `${'#'.repeat(b.data.level)} ${text}`;
  },
});

/* ---------------------------------------------------------------
 * 3.2 文字

defineComponent({

    return textarea(block.data.text, (v) => ctx.update({ text: v }),
      '输入文字，支持 **粗体**、*斜体*、`行内代码`、[链接](https://…)', 3);
  },

  },
});

/* ---------------------------------------------------------------
 * 3.3 表格（网格编辑 + 链接支持）
 * ------------------------------------------------------------- */
defineComponent({
  type: 'table',
  label: '表格',
  icon: '📊',
  create: () => ({
    header: ['列 1', '列 2'],
    rows: [['', ''], ['', '']],
  }),
  editor(block, ctx) {
    const d = block.data;
    const cols = Math.max(d.header.length, 1);
    const wrap = el('div', { class: 'table-editor' });

    /* 当前聚焦的单元格（用于插入链接） */
    let activeCell = null;

    function makeCellInput(value, onInputFn, placeholder) {
      const inp = el('input', {
        type: 'text',
        class: 'te-cell',
        value: value ?? '',
        placeholder,
        onInput: (e) => { onInputFn(e.target.value); ctx.touch(); },
      });
      inp.addEventListener('focus', () => { activeCell = inp; });
      return inp;
    }

    /* ---------- 表格主体 ---------- */
    const table = el('table', { class: 'te-table' });

    /* 表头 */
    const thead = el('thead');
    const headRow = el('tr');
    d.header.forEach((h, ci) => {
      headRow.append(el('th', {},
        makeCellInput(h, (v) => { d.header[ci] = v; }, `列${ci + 1}`)
      ));
    });
    headRow.append(el('th', { class: 'te-row-del' }));
    thead.append(headRow);
    table.append(thead);

    /* 数据行 */
    const tbody = el('tbody');
    d.rows.forEach((row, ri) => {
      const tr = el('tr');
      row.forEach((cell, ci) => {
        tr.append(el('td', {},
          makeCellInput(cell, (v) => { d.rows[ri][ci] = v; }, '')
        ));
      });
      tr.append(el('td', { class: 'te-row-del' },
        el('button', {
          class: 'btn-icon danger',
          type: 'button',
          title: '删除此行',
          onClick: () => { d.rows.splice(ri, 1); ctx.rerender(); },
        }, '✕')
      ));
      tbody.append(tr);
    });
    table.append(tbody);

    wrap.append(table);

    /* ---------- 工具栏 ---------- */
    wrap.append(el('div', { class: 'te-toolbar' },
      el('button', {
        class: 'btn tiny', type: 'button',
        onClick: () => { d.rows.push(new Array(cols).fill('')); ctx.rerender(); },
      }, '＋ 行'),
      el('button', {
        class: 'btn tiny', type: 'button',
        onClick: () => {
          d.header.push(`列 ${d.header.length + 1}`);
          d.rows.forEach((r) => r.push(''));
          ctx.rerender();
        },
      }, '＋ 列'),
      el('button', {
        class: 'btn tiny', type: 'button',
        disabled: cols <= 1,
        onClick: () => {
          if (d.header.length <= 1) return;
          d.header.pop();
          d.rows.forEach((r) => r.pop());
          ctx.rerender();
        },
      }, '－ 列'),
      el('button', {
        class: 'btn tiny link-trigger', type: 'button',
        title: '在当前选中的单元格插入链接',
        onMouseDown: (e) => e.preventDefault(),
        onClick: (e) => openLinkPopover(e.currentTarget, (text, url) => {
          if (!activeCell) { toast('请先点击一个表格单元格'); return false; }
          insertLinkIntoCell(activeCell, text, url);
          return true;
        }),
      }, '🔗 插入链接')
    ));

    /* ---------- 提示 ---------- */
    wrap.append(el('div', { class: 'te-hint' },
      '单元格支持 Markdown 行内语法，例如 ',
      el('code', {}, '[文字](https://…)'),
      ' 可插入网页链接，',
      el('code', {}, '[文字](#标题)'),
      ' 可跳转到文档内标题。'
    ));

    return wrap;
  },
  toMarkdown(b) {
    const { header, rows } = b.data;
    if (!header.length) return '';
    /* 只转义表格分隔符 |，保留行内 Markdown 语法（链接等） */
    const esc = (s) => String(s ?? '').replace(/\|/g, '\\|');
    const line = (arr) => `| ${arr.map(esc).join(' | ')} |`;
    const sep  = `| ${header.map(() => '---').join(' | ')} |`;
    return [line(header), sep, ...rows.map(line)].join('\n');
  },
});

defineComponent({

const CODE_LANGUAGES = [

const ALERT_TYPES = [
  ['note', '💡 提示'],
  ['tip', '✨ 技巧'],
  ['warning', '⚠️ 警告'],

defineComponent({
  type: 'admonition',
  label: '提示',
  icon: '💡',
  create: () => ({ kind: 'note', text: '' }),
  editor(block, ctx) {
    const d = block.data;
    return el('div', { class: 'stack' },
      select(d.kind, ALERT_TYPES, (v) => ctx.update({ kind: v })),
      textarea(d.text, (v) => ctx.update({ text: v }), '提示内容，支持 Markdown…', 3)

defineComponent({

      .map((it, i) => (b.data.ordered ? `${i + 1}. ${it}` : `- ${it}`))

/* ---------------------------------------------------------------
 * 工具栏顺序
 * ------------------------------------------------------------- */
const TOOLBAR = [
  'heading', 'paragraph', 'table', 'image', 'code',
  'admonition', 'quote', 'list', 'hr', 'details',
];

/* =========================================================================
 * 4. 状态 & 渲染
 * ========================================================================= */

const state = { blocks: [], seq: 0 };
let previewTimer = null;

const previewEl   = $('#preview');
const blockListEl = $('#blockList');
const paletteEl   = $('#palette');

function schedulePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => {
    renderPreview();
    persist();
  }, 100);
}

/* ---------- 本地持久化 ---------- */
const STORAGE_KEY = 'md-generator:blocks';
const THEME_KEY   = 'md-generator:theme';

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.blocks));
  } catch (_) { /* ignore */ }
}

function restore() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!Array.isArray(data)) return false;
    state.blocks = data.filter((b) => b && COMPONENTS[b.type]);
    state.seq = state.blocks.reduce((m, b) => Math.max(m, Number(b.id) || 0), 0);
    return state.blocks.length > 0;
  } catch (_) {
    return false;
  }
}

/* ---------- 编辑区渲染 ---------- */
function renderBlockList() {
  blockListEl.innerHTML = '';

  if (state.blocks.length === 0) {
    blockListEl.append(
      el('div', { class: 'empty' },
        el('div', { class: 'empty-icon' }, '📝'),
        el('p', {}, '还没有任何内容'),
        el('p', { class: 'muted' }, '点击上方按钮开始编写')
      )
    );
    return;
  }

  state.blocks.forEach((block, index) => {
    blockListEl.append(renderBlockCard(block, index));
  });

  $$('textarea', blockListEl).forEach(autoGrow);
}

function renderBlockCard(block, index) {
  const def = COMPONENTS[block.type];

  const ctx = {
    update(patch) {
      Object.assign(block.data, patch);
      schedulePreview();
    },
    touch() {
      schedulePreview();
    },
    rerender() {
      renderBlockList();
      schedulePreview();
    },
  };

  return el('div', { class: 'card', 'data-id': block.id },
    el('div', { class: 'card-head' },
      el('span', { class: 'card-badge' }, def.icon),
      el('span', { class: 'card-title' }, def.label),
      el('div', { class: 'card-actions' },
        el('button', {
          class: 'btn-icon', type: 'button', title: '上移',
          onClick: () => moveBlock(index, -1),
        }, '↑'),
        el('button', {
          class: 'btn-icon', type: 'button', title: '下移',
          onClick: () => moveBlock(index, 1),
        }, '↓'),
        el('button', {
          class: 'btn-icon danger', type: 'button', title: '删除',
          onClick: () => removeBlock(index),
        }, '✕')
      )
    ),
    el('div', { class: 'card-body' }, def.editor(block, ctx))
  );
}

/* ---------- 增删改 ---------- */
function addBlock(type) {
  const def = COMPONENTS[type];
  if (!def) return;

  const block = { id: ++state.seq, type, data: def.create() };
  state.blocks.push(block);

  renderBlockList();
  schedulePreview();

  requestAnimationFrame(() => {
    const card = blockListEl.querySelector(`.card[data-id="${block.id}"]`);
    if (!card) return;
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    const firstInput = card.querySelector('input, textarea, select');
    if (firstInput) firstInput.focus();
  });
}

function removeBlock(index) {
  state.blocks.splice(index, 1);
  renderBlockList();
  schedulePreview();
}

function moveBlock(index, delta) {
  const target = index + delta;
  if (target < 0 || target >= state.blocks.length) return;
  const [block] = state.blocks.splice(index, 1);
  state.blocks.splice(target, 0, block);
  renderBlockList();
  schedulePreview();
}

/* =========================================================================
 * 5. Markdown 生成
 * ========================================================================= */

function buildMarkdown() {
  const parts = state.blocks
    .map((block) => {
      const def = COMPONENTS[block.type];
      if (!def) return '';
      try {
        return def.toMarkdown(block) || '';
      } catch (err) {
        console.warn('组件生成 Markdown 失败：', block.type, err);
        return '';
      }
    })
    .map((s) => String(s).trim())
    .filter((s) => s !== '');

  return parts.length ? parts.join('\n\n') : '';
}

/* =========================================================================
 * 6. 预览渲染
 * ========================================================================= */

/* GitHub Alerts → 提示框 DOM */
const ADMONITION_META = {
  note:      { icon: '💡', label: '提示' },
  tip:       { icon: '✨', label: '技巧' },
  important: { icon: '📌', label: '重要' },
  warning:   { icon: '⚠️', label: '警告' },
  caution:   { icon: '🛑', label: '注意' },
};

const ALERT_RE = /\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]/i;

function stripLeadingText(root, prefixLength) {
  let remaining = prefixLength;
  let skipping = true;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let node;
  while (remaining > 0 && (node = walker.nextNode())) {
    let text = node.nodeValue || '';
    if (skipping) {
      const lead = text.match(/^\s*/)[0].length;
      text = text.slice(lead);
      node.nodeValue = text;
      skipping = false;
    }
    if (!text) continue;
    const take = Math.min(remaining, text.length);
    node.nodeValue = text.slice(take);
    remaining -= take;
  }
}

function transformAlerts(container) {
  Array.from(container.querySelectorAll('blockquote')).forEach((bq) => {
    const firstP = bq.querySelector('p');
    if (!firstP) return;

    const textContent = firstP.textContent || '';
    const match = textContent.match(ALERT_RE);
    if (!match) return;

    const idx = textContent.indexOf(match[0]);
    if (idx < 0) return;
    if (textContent.slice(0, idx).trim() !== '') return;

    const kind = match[1].toLowerCase();
    const meta = ADMONITION_META[kind] || ADMONITION_META.note;

    stripLeadingText(firstP, idx + match[0].length);
    if (!firstP.textContent.trim() && firstP.children.length === 0) {
      firstP.remove();
    }

    const body = el('div', { class: 'admonition-body' });
    while (bq.firstChild) body.append(bq.firstChild);

    const titleEl = el('div', { class: 'admonition-title' },
      el('span', {}, meta.icon),
      el('span', {}, meta.label)
    );

    const wrap = el('div', { class: `admonition ${kind}` }, titleEl, body);
    bq.replaceWith(wrap);
  });
}

function highlightCode(container) {
  if (typeof hljs === 'undefined') return;
  container.querySelectorAll('pre code').forEach((block) => {
    try { hljs.highlightElement(block); } catch (_) { /* ignore */ }
  });
}

function decorateLinks(container) {
  container.querySelectorAll('a[href]').forEach((a) => {
    const href = a.getAttribute('href') || '';
    if (/^https?:\/\//i.test(href)) {
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener noreferrer');
    }
  });
}

function renderPreview() {
  const md = buildMarkdown();

  if (!md.trim()) {
    previewEl.innerHTML =
      '<div class="preview-empty">在左侧添加组件后，这里会实时渲染 Markdown 预览</div>';
    return;
  }

  let html;
  try {
    html = (typeof marked !== 'undefined')
      ? marked.parse(md, { gfm: true, breaks: false })
      : `<pre>${md.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))}</pre>`;
  } catch (err) {
    console.error('Markdown 解析失败：', err);
    previewEl.innerHTML = '<div class="preview-empty">Markdown 解析失败，请检查内容</div>';
    return;
  }

  previewEl.innerHTML = html;
  transformAlerts(previewEl);
  highlightCode(previewEl);
  decorateLinks(previewEl);
}

/* =========================================================================
 * 7. 底部操作
 * ========================================================================= */

async function copyMarkdown() {
  const md = buildMarkdown();
  if (!md.trim()) { toast('还没有内容可复制'); return; }

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(md);
    } else {
      throw new Error('clipboard unavailable');
    }
  } catch (_) {
    const ta = document.createElement('textarea');
    ta.value = md;
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.append(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); } catch (e) { /* ignore */ }
    ta.remove();
  }

  toast('Markdown 已复制到剪贴板');
}

function downloadMarkdown() {
  const md = buildMarkdown();
  if (!md.trim()) { toast('还没有内容可下载'); return; }

  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'README.md';
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);

  toast('已下载 README.md');
}

function clearAll() {
  if (!state.blocks.length) { toast('当前已经是空的'); return; }
  if (!window.confirm('确定要清空所有内容吗？此操作不可撤销。')) return;

  state.blocks = [];
  try { localStorage.removeItem(STORAGE_KEY); } catch (_) { /* ignore */ }

  renderBlockList();
  renderPreview();
  toast('已清空所有内容');
}

/* =========================================================================
 * 8. 主题
 * ========================================================================= */

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = $('#themeToggle');
  if (btn) {
    btn.textContent = theme === 'dark' ? '☀️' : '🌙';
    btn.title = theme === 'dark' ? '切换到浅色模式' : '切换到深色模式';
  }
  try { localStorage.setItem(THEME_KEY, theme); } catch (_) { /* ignore */ }
}

function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (_) { /* ignore */ }

  let prefersDark = false;
  try { prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches; }
  catch (_) { /* ignore */ }

  applyTheme(saved || (prefersDark ? 'dark' : 'light'));
}

/* =========================================================================
 * 9. 初始化
 * ========================================================================= */

/** 配置 marked：为标题自动生成锚点 id，支持 #标题 跳转 */
function configureMarked() {
  if (typeof marked === 'undefined') return;
  marked.use({
    renderer: {
      heading(token) {
        const { tokens, depth, text } = token;
        const htmlText = this.parser.parseInline(tokens);
        const id = slugify(text || '');
        const idAttr = id ? ` id="${String(id).replace(/"/g, '&quot;')}"` : '';
        return `<h${depth}${idAttr}>${htmlText}</h${depth}>\n`;
      },
    },
  });
}

function seedDefault() {
  const push = (type, data) => {
    const def = COMPONENTS[type];
    state.blocks.push({
      id: ++state.seq,
      type,
      data: Object.assign(def.create(), data),
    });
  };

  push('heading', { level: 1, text: '我的文档' });
  push('paragraph', {
    text: '这是一个使用 **Markdown 文档生成器** 创建的文档：左侧编辑，右侧实时预览。',
  });
  push('admonition', {
    kind: 'tip',
    text: '点击左侧上方的按钮即可添加标题、表格、代码块、提示等组件。',
  });
  push('code', {
    lang: 'javascript',
    code: "console.log('Hello, Markdown!');",
  });
}

function renderPalette() {
  paletteEl.innerHTML = '';
  TOOLBAR.forEach((type) => {
    const def = COMPONENTS[type];
    if (!def) return;
    paletteEl.append(
      el('button', {
        class: 'pal-btn',
        type: 'button',
        title: `添加${def.label}`,
        onClick: () => addBlock(type),
      },
        el('span', { class: 'ico' }, def.icon),
        def.label
      )
    );
  });
}

function bindEvents() {
  $('#themeToggle').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  });

  $('#btnCopy').addEventListener('click', copyMarkdown);
  $('#btnDownload').addEventListener('click', downloadMarkdown);
  $('#btnClear').addEventListener('click', clearAll);

  window.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      downloadMarkdown();
    }
  });
}

function init() {
  if (typeof hljs !== 'undefined') {
    try { hljs.configure({ ignoreUnescapedHTML: true }); } catch (_) { /* ignore */ }
  }

  configureMarked();
  renderPalette();

  const hasSaved = restore();
  if (!hasSaved) seedDefault();

  renderBlockList();
  renderPreview();

  bindEvents();
  initTheme();
}

init();
</script>
</body>
