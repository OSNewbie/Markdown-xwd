<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Markdown 文档生成器</title>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>

<style>
:root {
  --bg:#fff; --bg-soft:#f6f8fa; --bg-elev:#fff;
  --fg:#1f2328; --fg-muted:#59636e;
  --border:#d1d9e0; --border-soft:#e5e9ee;
  --accent:#0969da; --accent-soft:rgba(9,105,218,.09);
  --code-bg:rgba(129,139,152,.12); --pre-bg:#f6f8fa;
  --danger:#cf222e; --danger-soft:rgba(207,34,46,.09);
  --shadow:0 1px 3px rgba(0,0,0,.06);
  --hl-comment:#6e7781; --hl-keyword:#cf222e; --hl-string:#0a3069;
  --hl-number:#0550ae; --hl-function:#8250df; --hl-attr:#953800;
  --hl-builtin:#0550ae; --hl-meta:#6e7781;
  --adm-note:#0969da; --adm-note-bg:#ddf4ff;
  --adm-tip:#1a7f37; --adm-tip-bg:#dafbe1;
  --adm-important:#8250df; --adm-important-bg:#f5f0ff;
  --adm-warning:#9a6700; --adm-warning-bg:#fff8c5;
  --adm-caution:#cf222e; --adm-caution-bg:#ffebe9;
}
[data-theme="dark"] {
  --bg:#0d1117; --bg-soft:#151b23; --bg-elev:#0d1117;
  --fg:#e6edf3; --fg-muted:#9198a1;
  --border:#3d444d; --border-soft:#2a313a;
  --accent:#4493f8; --accent-soft:rgba(68,147,248,.12);
  --code-bg:rgba(101,108,118,.25); --pre-bg:#151b23;
  --danger:#f85149; --danger-soft:rgba(248,81,73,.12);
  --shadow:0 1px 3px rgba(0,0,0,.4);
  --hl-comment:#8b949e; --hl-keyword:#ff7b72; --hl-string:#a5d6ff;
  --hl-number:#79c0ff; --hl-function:#d2a8ff; --hl-attr:#ffa657;
  --hl-builtin:#79c0ff; --hl-meta:#8b949e;
  --adm-note:#4493f8; --adm-note-bg:rgba(56,139,253,.10);
  --adm-tip:#3fb950; --adm-tip-bg:rgba(63,185,80,.10);
  --adm-important:#ab7df8; --adm-important-bg:rgba(171,125,248,.10);
  --adm-warning:#d29922; --adm-warning-bg:rgba(210,153,34,.10);
  --adm-caution:#f85149; --adm-caution-bg:rgba(248,81,73,.10);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
  font-size: 14px; background: var(--bg); color: var(--fg);
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

.topbar {
  flex: 0 0 auto; height: 52px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; border-bottom: 1px solid var(--border); background: var(--bg-elev);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  display: grid; place-items: center;
  flex: 0 0 auto; width: 28px; height: 28px; border-radius: 7px;
  background: var(--accent); color: #fff; font-weight: 700; font-size: 13px; letter-spacing: -.5px;
}
.brand-name { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-actions { display: flex; gap: 6px; align-items: center; }
.lang-btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 34px; height: 26px; padding: 0 8px;
  font-family: inherit; font-size: 12px; font-weight: 600;
  color: var(--fg-muted); background: transparent;
  border: 1px solid var(--border); border-radius: 6px;
  cursor: pointer; transition: .15s;
}
.lang-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

.layout { flex: 1 1 auto; display: flex; min-height: 0; }
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.pane-editor  { flex: 0 0 46%; border-right: 1px solid var(--border); }
.pane-preview { flex: 1 1 0; background: var(--bg); }

.page-bar {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 6px;
  padding: 8px 12px;
  background: var(--bg-elev); border-bottom: 1px solid var(--border);
}
.page-select {
  flex: 1 1 auto; min-width: 0;
  padding: 5px 9px;
  font-family: inherit; font-size: 13px;
  color: var(--fg); background: var(--bg);
  border: 1px solid var(--border); border-radius: 6px;
  cursor: pointer; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.page-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.pane-head {
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; padding: 9px 14px;
  font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
  color: var(--fg-muted); background: var(--bg-soft);
  border-bottom: 1px solid var(--border);
}
.pane-body { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; min-height: 0; }
.pane-preview .pane-body { scroll-behavior: smooth; }
.pane-body::-webkit-scrollbar { width: 10px; height: 10px; }
.pane-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; border: 2px solid var(--bg); }
.pane-body::-webkit-scrollbar-track { background: transparent; }

.bottombar {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 10px;
  padding: 11px 16px;
  border-top: 1px solid var(--border); background: var(--bg-elev);
}
.spacer { flex: 1 1 auto; }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; padding: 7px 14px;
  font-family: inherit; font-size: 13px; font-weight: 500;
  color: var(--fg); background: var(--bg-elev);
  border: 1px solid var(--border); border-radius: 7px;
  cursor: pointer; transition: background .15s, border-color .15s, color .15s;
  white-space: nowrap;
}
.btn:hover { background: var(--bg-soft); border-color: var(--fg-muted); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { color: #fff; background: var(--accent); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.danger { color: var(--danger); border-color: var(--border); }
.btn.danger:hover { background: var(--danger-soft); border-color: var(--danger); }
.btn.tiny { padding: 4px 9px; font-size: 12px; border-radius: 6px; }

.btn-icon {
  display: grid; place-items: center;
  width: 26px; height: 26px; padding: 0;
  font-size: 13px; color: var(--fg-muted);
  background: transparent; border: 1px solid transparent; border-radius: 6px;
  cursor: pointer; transition: .15s;
}
.btn-icon:hover { color: var(--fg); background: var(--bg-elev); border-color: var(--border); }
.btn-icon.danger:hover { color: var(--danger); background: var(--danger-soft); border-color: var(--danger); }

.input {
  width: 100%; padding: 6px 9px;
  font-family: inherit; font-size: 13px;
  color: var(--fg); background: var(--bg);
  border: 1px solid var(--border); border-radius: 6px;
  outline: none; transition: border-color .15s, box-shadow .15s;
}
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input::placeholder { color: var(--fg-muted); opacity: .7; }
.textarea { resize: none; min-height: 62px; line-height: 1.6; overflow: hidden; }
.select { cursor: pointer; }

.stack { display: flex; flex-direction: column; gap: 8px; }
.row   { display: flex; gap: 8px; align-items: center; }
.row > .select { flex: 0 0 120px; }
.field { display: grid; grid-template-columns: 76px minmax(0,1fr); align-items: center; gap: 8px; }
.field-label { font-size: 12px; color: var(--fg-muted); }
.hint { font-size: 12px; color: var(--fg-muted); }

.seg { display: inline-flex; padding: 2px; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 7px; align-self: flex-start; }
.seg-btn { padding: 4px 12px; font-family: inherit; font-size: 12.5px; color: var(--fg-muted); background: transparent; border: none; border-radius: 5px; cursor: pointer; transition: .15s; }
.seg-btn.active { color: var(--fg); background: var(--bg-elev); box-shadow: var(--shadow); }

.palette { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; background: var(--bg-soft); border-bottom: 1px solid var(--border); }
.pal-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  font-family: inherit; font-size: 13px;
  color: var(--fg); background: var(--bg-elev);
  border: 1px solid var(--border); border-radius: 7px;
  cursor: pointer; transition: .15s; white-space: nowrap;
}
.pal-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.pal-btn .ico { font-size: 14px; line-height: 1; }

.card { margin: 10px 12px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 9px; overflow: hidden; transition: border-color .15s, box-shadow .15s; }
.card:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.card.card-unknown { border-color: var(--danger); }
.card.card-unknown:focus-within { box-shadow: 0 0 0 3px var(--danger-soft); }
.card-head { display: flex; align-items: center; gap: 8px; padding: 5px 6px 5px 10px; background: var(--bg-soft); border-bottom: 1px solid var(--border-soft); }
.card.card-unknown .card-head { background: var(--danger-soft); }
.card-badge { display: grid; place-items: center; min-width: 20px; height: 20px; padding: 0 4px; font-size: 12px; line-height: 1; color: var(--accent); background: var(--accent-soft); border-radius: 5px; }
.card.card-unknown .card-badge { color: var(--danger); background: rgba(207,34,46,.15); }
.card-title { flex: 1 1 auto; font-size: 12.5px; font-weight: 600; color: var(--fg-muted); }
.card-actions { display: flex; gap: 2px; }
.card-body { padding: 10px; }

.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 60px 20px; color: var(--fg-muted); text-align: center; }
.empty-icon { font-size: 32px; opacity: .55; margin-bottom: 6px; }
.empty p { margin: 0; font-size: 13.5px; }
.empty .muted { font-size: 12.5px; opacity: .75; }

.table-editor { overflow-x: auto; margin: 0 -2px; }
.te-table { width: 100%; min-width: 260px; border-collapse: collapse; font-size: 13px; table-layout: auto; }
.te-table th, .te-table td { border: 1px solid var(--border); padding: 0; vertical-align: middle; }
.te-table th { background: var(--bg-soft); }
.te-cell { display: block; width: 100%; min-width: 60px; border: none; outline: none; padding: 7px 10px; background: transparent; font: inherit; color: var(--fg); border-radius: 0; }
.te-cell:focus { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.te-cell::placeholder { color: var(--fg-muted); opacity: .6; }
.te-table th .te-cell { font-weight: 600; }
.te-row-del { width: 38px; text-align: center; background: var(--bg-soft); }
.te-row-del .btn-icon { display: inline-flex; margin: 2px; }
.te-toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.te-hint { margin-top: 6px; font-size: 12px; color: var(--fg-muted); line-height: 1.5; }
.te-hint code { padding: 1px 5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; background: var(--code-bg); border-radius: 4px; }

.sub-item {
  display: flex; flex-direction: column; gap: 6px;
  padding: 8px; margin-bottom: 6px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
}
.sub-item-head { display: flex; align-items: center; gap: 6px; }

.markdown-body { max-width: 900px; margin: 0 auto; padding: 28px 34px 100px; font-size: 15px; line-height: 1.72; color: var(--fg); word-wrap: break-word; }
.markdown-body > *:first-child { margin-top: 0 !important; }
.markdown-body > *:last-child  { margin-bottom: 0 !important; }
.markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4, .markdown-body h5, .markdown-body h6 {
  margin: 1.6em 0 .65em; font-weight: 600; line-height: 1.3; scroll-margin-top: 12px; transition: background-color .35s;
}
.markdown-body h1 { font-size: 2em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
.markdown-body h2 { font-size: 1.5em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
.markdown-body h3 { font-size: 1.25em; }
.markdown-body h4 { font-size: 1em; }
.markdown-body p { margin: 0 0 1em; }
.markdown-body a { color: var(--accent); text-decoration: none; cursor: pointer; }
.markdown-body a:hover { text-decoration: underline; }
.markdown-body img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border-soft); background: var(--bg-soft); vertical-align: middle; }
.markdown-body ul, .markdown-body ol { margin: 0 0 1em; padding-left: 1.9em; }
.markdown-body li { margin: .3em 0; }
.markdown-body li > p { margin: .3em 0; }
.markdown-body hr { height: 1px; margin: 2em 0; padding: 0; border: 0; background: var(--border); }
.markdown-body blockquote { margin: 1em 0; padding: 0 1em; color: var(--fg-muted); border-left: .25em solid var(--border); }
.markdown-body blockquote > :first-child { margin-top: 0; }
.markdown-body blockquote > :last-child  { margin-bottom: 0; }

.markdown-body table { display: block; width: max-content; max-width: 100%; margin: 1em 0; overflow: auto; border-collapse: collapse; border-spacing: 0; font-size: 14px; }
.markdown-body th, .markdown-body td { padding: 7px 13px; border: 1px solid var(--border); }
.markdown-body th { font-weight: 600; background: var(--bg-soft); }
.markdown-body tbody tr:nth-child(2n) td { background: var(--bg-soft); }

.markdown-body code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: .86em; padding: .18em .4em; background: var(--code-bg); border-radius: 6px; }
.markdown-body pre { margin: 1em 0; padding: 14px 16px; overflow: auto; background: var(--pre-bg); border: 1px solid var(--border-soft); border-radius: 8px; line-height: 1.6; }
.markdown-body pre code { padding: 0; font-size: 13px; background: transparent; border-radius: 0; }

.markdown-body kbd {
  display: inline-block; padding: 2px 6px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.85em; line-height: 1.2;
  color: var(--fg); background: var(--bg-soft);
  border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px;
  box-shadow: 0 1px 0 rgba(0,0,0,.05); vertical-align: middle;
}
.markdown-body video { max-width: 100%; border-radius: 8px; border: 1px solid var(--border-soft); background: #000; }

.mermaid-rendered { margin: 1em 0; text-align: center; background: var(--bg-soft); border: 1px solid var(--border-soft); border-radius: 8px; padding: 14px; overflow-x: auto; }
.mermaid-rendered svg { max-width: 100%; height: auto; }

.hljs-comment, .hljs-quote { color: var(--hl-comment); font-style: italic; }
.hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-type, .hljs-doctag { color: var(--hl-keyword); }
.hljs-string, .hljs-regexp, .hljs-addition { color: var(--hl-string); }
.hljs-number, .hljs-symbol, .hljs-bullet, .hljs-link { color: var(--hl-number); }
.hljs-title, .hljs-section, .hljs-name, .hljs-title.function_ { color: var(--hl-function); }
.hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable, .hljs-property { color: var(--hl-attr); }
.hljs-built_in, .hljs-class .hljs-title { color: var(--hl-builtin); }
.hljs-meta { color: var(--hl-meta); }
.hljs-emphasis { font-style: italic; }
.hljs-strong { font-weight: 700; }

.admonition { margin: 1em 0; padding: 10px 16px 12px; border-left: 4px solid var(--adm-color); border-radius: 7px; background: var(--adm-bg); color: var(--fg); }
.admonition-title { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; font-weight: 600; font-size: 14.5px; color: var(--adm-color); }
.admonition-body > :first-child { margin-top: 0; }
.admonition-body > :last-child { margin-bottom: 0; }
.admonition.note      { --adm-color: var(--adm-note);      --adm-bg: var(--adm-note-bg); }
.admonition.tip       { --adm-color: var(--adm-tip);       --adm-bg: var(--adm-tip-bg); }
.admonition.important { --adm-color: var(--adm-important); --adm-bg: var(--adm-important-bg); }
.admonition.warning   { --adm-color: var(--adm-warning);   --adm-bg: var(--adm-warning-bg); }
.admonition.caution   { --adm-color: var(--adm-caution);   --adm-bg: var(--adm-caution-bg); }

.markdown-body details { margin: 1em 0; padding: 10px 16px; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 8px; }
.markdown-body summary { font-weight: 600; cursor: pointer; user-select: none; list-style: none; }
.markdown-body summary::-webkit-details-marker { display: none; }
.markdown-body summary::before { content: "▸"; display: inline-block; margin-right: 6px; color: var(--fg-muted); transition: transform .18s; }
.markdown-body details[open] > summary::before { transform: rotate(90deg); }
.markdown-body details[open] > summary { margin-bottom: 8px; }

.preview-empty { display: flex; align-items: center; justify-content: center; min-height: 55vh; padding: 40px; font-size: 14px; color: var(--fg-muted); text-align: center; flex-direction: column; gap: 10px; }
.preview-fallback { margin: 0 auto; padding: 20px 24px; max-width: 900px; }
.preview-fallback .fallback-note { margin-bottom: 12px; padding: 10px 14px; font-size: 12.5px; line-height: 1.55; color: var(--fg-muted); background: var(--danger-soft); border-left: 3px solid var(--danger); border-radius: 6px; }
.preview-fallback pre { margin: 0; padding: 14px 16px; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.6; color: var(--fg); background: var(--pre-bg); border: 1px solid var(--border-soft); border-radius: 8px; white-space: pre-wrap; word-break: break-word; overflow-x: auto; }

.link-pop { position: fixed; z-index: 1000; width: 340px; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 9px; box-shadow: 0 8px 24px rgba(0,0,0,.18); animation: popIn .12s ease-out; }
@keyframes popIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.link-pop .link-field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--fg-muted); }
.link-pop .link-hint { font-size: 11.5px; color: var(--fg-muted); line-height: 1.5; }
.link-pop .link-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 2px; }

.guide-overlay { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(0,0,0,.45); opacity: 0; visibility: hidden; transition: opacity .2s, visibility .2s; }
.guide-overlay.open { opacity: 1; visibility: visible; }
.guide-modal { display: flex; flex-direction: column; width: min(980px, 100%); max-height: min(88vh, 100%); background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.3); transform: translateY(8px) scale(.995); transition: transform .2s; }
.guide-overlay.open .guide-modal { transform: translateY(0) scale(1); }
.guide-head { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px 12px 20px; border-bottom: 1px solid var(--border); background: var(--bg-soft); }
.guide-head h2 { margin: 0; font-size: 15.5px; font-weight: 600; }
.guide-head .guide-close { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0; font-size: 14px; color: var(--fg-muted); background: transparent; border: 1px solid var(--border); border-radius: 7px; cursor: pointer; transition: .15s; }
.guide-head .guide-close:hover { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }
.guide-body { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; padding: 20px 22px 30px; min-height: 0; }
.guide-body::-webkit-scrollbar { width: 10px; }
.guide-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; border: 2px solid var(--bg-elev); }
.guide-intro { margin: 0 0 20px; padding: 10px 14px; font-size: 13px; line-height: 1.65; color: var(--fg-muted); background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 6px; }
.guide-section { margin-bottom: 26px; }
.guide-section h3 { margin: 0 0 12px; font-size: 14.5px; font-weight: 600; color: var(--fg); }
.guide-item { margin-bottom: 12px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--bg); }
.guide-item-note { padding: 7px 12px; font-size: 12.5px; line-height: 1.55; color: var(--fg-muted); background: var(--bg-soft); border-bottom: 1px solid var(--border-soft); }
.guide-item-code { margin: 0; padding: 10px 14px; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 12.5px; line-height: 1.6; color: var(--fg); background: var(--pre-bg); white-space: pre; overflow-x: auto; border: none; border-bottom: 1px dashed var(--border-soft); }
.guide-item-result.markdown-body { max-width: none; margin: 0; padding: 12px 16px; font-size: 14px; line-height: 1.65; }

/* ---------- 1. 工具 ---------- */
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, val] of Object.entries(attrs)) {
    if (val === null || val === undefined || val === false) continue;
    if (key === 'class')                     node.className = val;
    else if (key === 'html')                 node.innerHTML = val;
    else if (key === 'text')                 node.textContent = val;
    else if (key.startsWith('on') && typeof val === 'function')
      node.addEventListener(key.slice(2).toLowerCase(), val);
    else node.setAttribute(key, val);
  }
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function input(value, onInput, placeholder = '') {
  return el('input', {
    type: 'text', class: 'input',
    value: value ?? '', placeholder,
    onInput: (e) => onInput(e.target.value),
  });
}

function textarea(value, onInput, placeholder = '', rows = 3) {
  const ta = el('textarea', { class: 'input textarea', placeholder, rows });
  ta.value = value ?? '';
  ta.addEventListener('input', () => { onInput(ta.value); autoGrow(ta); });
  return ta;
}

function autoGrow(ta) {
  ta.style.height = 'auto';
  ta.style.height = Math.max(ta.scrollHeight, 62) + 'px';
}

function select(value, options, onChange) {
  const sel = el('select', { class: 'input select' });
  for (const [val, label] of options) {
    const opt = el('option', { value: val }, label);
    if (String(val) === String(value)) opt.selected = true;
    sel.append(opt);
  }
  sel.addEventListener('change', () => onChange(sel.value));
  return sel;
}

function field(labelText, control) {
  return el('div', { class: 'field' }, el('span', { class: 'field-label' }, labelText), control);
}

let toastTimer = null;
function toast(message) {
  let node = $('.toast');
  if (!node) { node = el('div', { class: 'toast' }); document.body.append(node); }
  node.textContent = message;
  requestAnimationFrame(() => node.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => node.classList.remove('show'), 1900);
}

function slugify(text) {
  return String(text ?? '')
    .trim().toLowerCase()
    .replace(/<[^>]*>/g, '')
    .replace(/[^\w\u4e00-\u9fa5\s-]/g, '')
    .replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
}

function slugifyAscii(text) {
  return String(text ?? '')
    .trim().toLowerCase()
    .replace(/<[^>]*>/g, '')
    .replace(/[^\w\s-]/g, '')
    .replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
}

const LANG_KEY = 'md-generator:lang';
function detectInitialLang() {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved === 'zh' || saved === 'en') return saved;
  } catch (_) {}
  try {
    return String(navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
  } catch (_) { return 'zh'; }
}

function saveLang() { try { localStorage.setItem(LANG_KEY, state.lang); } catch (_) {} }
function currentPage() {
  return state.pages.find(p => p.id === state.currentPageId) || state.pages[0] || null;
}
function currentBlocks() {
  const p = currentPage();
  return p ? p.blocks : [];
}

/* ---------- 5. 页面 & 链接辅助 ---------- */
function normalizePage(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const id = Number(raw.id) || ++state.pageSeq;
  const title = String(raw.title || '').trim() || t('newPageDefault');
  const slug = String(raw.slug || '').trim() || slugifyAscii(title) || ('page-' + id);
  const blocksRaw = Array.isArray(raw.blocks) ? raw.blocks : [];
  const blocks = blocksRaw.map(normalizeBlock).filter(Boolean);
  return { id, title, slug, blocks };
}

function resolvePageByRef(ref) {
  if (!ref) return null;
  const clean = String(ref).replace(/\.md$/i, '').replace(/^\/+/,'').trim();
  if (!clean) return null;
  /* 依次匹配 slug → title → slugify(title) → slugifyAscii(title) */
  let page = state.pages.find(p => p.slug === clean);
  if (page) return page;
  page = state.pages.find(p => p.title === ref || p.title === clean);
  if (page) return page;
  page = state.pages.find(p => slugify(p.title) === clean);
  if (page) return page;
  page = state.pages.find(p => slugifyAscii(p.title) === clean);
  return page || null;
}

function scrollToAnchor(anchor) {
  if (!anchor) return;
  const decoded = decodeURIComponent(String(anchor));
  const container = $('.pane-preview .pane-body');
  if (!container) return;

  let target = previewEl.querySelector('#' + cssEscape(decoded));
  if (!target) target = previewEl.querySelector('#' + cssEscape(slugify(decoded)));
  if (!target) {
    /* 模糊匹配标题 */
    const headings = previewEl.querySelectorAll('h1,h2,h3,h4,h5,h6');
    for (const h of headings) {
      const text = h.textContent || '';
      const s1 = slugify(text), s2 = slugifyAscii(text);
      if (s1 === decoded || s1 === slugify(decoded) || s2 === decoded || s2 === slugify(decoded)) {
        target = h;
        break;
      }
    }
  }
  if (target) {
    const top = target.getBoundingClientRect().top - container.getBoundingClientRect().top + container.scrollTop - 8;
    container.scrollTo({ top, behavior: 'smooth' });
    target.style.backgroundColor = 'var(--accent-soft)';
    setTimeout(() => { target.style.backgroundColor = ''; }, 1400);
  } else {
    toast(t('anchorNotFound') + ': ' + decoded);
  }
}

function cssEscape(str) {
  try { return window.CSS && CSS.escape ? CSS.escape(str) : String(str).replace(/[^a-zA-Z0-9_-]/g, c => '\\' + c); }
  catch (_) { return String(str).replace(/[^a-zA-Z0-9_-]/g, c => '\\' + c); }
}

function switchPage(pageId, anchor) {
  if (!state.pages.some(p => p.id === pageId)) return;
  state.currentPageId = pageId;
  try { localStorage.setItem('md-generator:currentPageId', String(pageId)); } catch (_) {}
  renderPageBar();
  renderBlockList();
  renderPreview();
  if (anchor) setTimeout(() => scrollToAnchor(anchor), 120);
}

/* ---------- 6. 数据 normalize ---------- */
function normalizeData(type, raw) {
  const def = COMPONENTS[type];
  const base = def.create();
  const src = (raw && typeof raw === 'object') ? raw : {};
  const merged = Object.assign({}, base, src);

  ['text','code','url','alt','summary','body','items','lang','keys','poster'].forEach(k => {
    if (k in merged && merged[k] != null && typeof merged[k] !== 'string') merged[k] = String(merged[k]);
  });

  if (type === 'heading') {
    const lv = Number(merged.level);
    merged.level = [1,2,3,4].includes(lv) ? lv : 1;
    if (typeof merged.text !== 'string') merged.text = '';
  } else if (type === 'table') {
    if (!Array.isArray(merged.header)) merged.header = base.header.slice();
    if (!Array.isArray(merged.rows))   merged.rows   = base.rows.slice();
    merged.header = merged.header.map(h => String(h ?? ''));
    merged.rows = merged.rows.map(r => Array.isArray(r) ? r.map(c => String(c ?? '')) : []);
    const cols = merged.header.length;
    merged.rows = merged.rows.map(r => {
      const out = r.slice(0, cols);
      while (out.length < cols) out.push('');
      return out;
    });
    if (!merged.header.length) merged.header = base.header.slice();
  } else if (type === 'admonition') {
    if (!['note','tip','warning','important','caution'].includes(merged.kind)) merged.kind = 'note';
    if (typeof merged.text !== 'string') merged.text = '';
  } else if (type === 'toc') {
    if (typeof merged.title !== 'string') merged.title = '';
  } else if (type === 'badge') {
    if (!Array.isArray(merged.items) || !merged.items.length) merged.items = base.items.slice();
    merged.items = merged.items.map(it => ({
      label: String((it && it.label) ?? ''),
      message: String((it && it.message) ?? ''),
      color: String((it && it.color) ?? 'green'),
    }));
  } else if (type === 'tabs') {
    if (!Array.isArray(merged.items) || !merged.items.length) merged.items = base.items.slice();
    merged.items = merged.items.map(it => ({
      title: String((it && it.title) ?? ''),
      body: String((it && it.body) ?? ''),
    }));
  } else if (type === 'center') {
    if (typeof merged.text !== 'string') merged.text = '';
  } else if (type === 'video') {
    if (typeof merged.url !== 'string') merged.url = '';
    if (typeof merged.poster !== 'string') merged.poster = '';
  } else if (type === 'kbd') {
    if (typeof merged.keys !== 'string') merged.keys = '';
  } else if (type === 'mermaid') {
    if (typeof merged.code !== 'string') merged.code = base.code || '';
  } else if (type === 'paragraph' || type === 'quote') {
    if (typeof merged.text !== 'string') merged.text = '';
  } else if (type === 'list') {
    merged.ordered = !!merged.ordered;
    if (typeof merged.items !== 'string') merged.items = '';
  } else if (type === 'details') {
    if (typeof merged.summary !== 'string') merged.summary = '';
    if (typeof merged.body    !== 'string') merged.body    = '';
  }
  return merged;
}

function normalizeBlock(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const type = String(raw.type || '');
  let id = Number(raw.id);
  if (!Number.isFinite(id) || id <= 0) id = ++state.seq;
  else state.seq = Math.max(state.seq, id);

  if (COMPONENTS[type] && type !== 'unknown') {
    return { id, type, data: normalizeData(type, raw.data) };
  }
  if (!raw.data && !type) return null;
  return { id, type: 'unknown', data: { originalType: type || '(none)', rawData: raw.data ?? null } };
}

defineComponent({
  type:'table', icon:'📊',

  editor(block, ctx) {
    const d = block.data;
    const cols = Math.max(d.header.length, 1);
    const wrap = el('div', { class: 'table-editor' });
    let activeCell = null;
    function makeCellInput(value, onInputFn, placeholder) {
      const inp = el('input', {
        type:'text', class:'te-cell', value: value ?? '', placeholder,
        onInput: (e) => { onInputFn(e.target.value); ctx.touch(); },
      });
      inp.addEventListener('focus', () => { activeCell = inp; });

    }
    const table = el('table', { class:'te-table' });
    const thead = el('thead');
    const headRow = el('tr');
    d.header.forEach((h, ci) => {
      headRow.append(el('th', {}, makeCellInput(h, v => { d.header[ci] = v; }, `C${ci+1}`)));
    });
    headRow.append(el('th', { class:'te-row-del' }));
    thead.append(headRow); table.append(thead);
    const tbody = el('tbody');
    d.rows.forEach((row, ri) => {
      const tr = el('tr');
      row.forEach((cell, ci) => {
        tr.append(el('td', {}, makeCellInput(cell, v => { d.rows[ri][ci] = v; }, '')));
      });
      tr.append(el('td', { class:'te-row-del' },
        el('button', {
          class:'btn-icon danger', type:'button', title:t('deleteRow'),
          onClick: () => { d.rows.splice(ri,1); ctx.rerender(); },
        }, '✕')
      ));
      tbody.append(tr);
    });
    table.append(tbody);
    wrap.append(table);
    wrap.append(el('div', { class:'te-toolbar' },
      el('button', { class:'btn tiny', type:'button', onClick: () => { d.rows.push(new Array(cols).fill('')); ctx.rerender(); } }, t('addRow')),
      el('button', { class:'btn tiny', type:'button', onClick: () => { d.header.push(`列 ${d.header.length+1}`); d.rows.forEach(r => r.push('')); ctx.rerender(); } }, t('addCol')),
      el('button', { class:'btn tiny', type:'button', disabled: cols <= 1, onClick: () => { if (d.header.length <= 1) return; d.header.pop(); d.rows.forEach(r => r.pop()); ctx.rerender(); } }, t('removeCol')),
      el('button', {
        class:'btn tiny link-trigger', type:'button', title:t('linkBtnTitle'),
        onMouseDown: e => e.preventDefault(),
        onClick: e => openLinkPopover(e.currentTarget, (text, url) => {
          if (!activeCell) { toast(t('linkNeedCell')); return false; }
          insertLinkIntoCell(activeCell, text, url);
          return true;
        }),
      }, t('insertLink'))
    ));
    wrap.append(el('div', { class:'te-hint' },
      t('tableHintPre'), el('code', {}, '[text](https://…)'),
      t('tableHintMid1'), el('code', {}, '[text](#heading)'),
      t('tableHintMid2')
    ));
    return wrap;
  },
  toMarkdown(b) {
    const { header, rows } = b.data;
    if (!Array.isArray(header) || !header.length) return '';
    const esc = s => String(s ?? '').replace(/\|/g, '\\|');
    const line = arr => `| ${arr.map(esc).join(' | ')} |`;
    const sep = `| ${header.map(() => '---').join(' | ')} |`;
    return [line(header), sep, ...rows.map(line)].join('\n');
  },
});

let currentPopover = null;
function closeLinkPopover() {
  if (!currentPopover) return;
  currentPopover.remove();
  currentPopover = null;
  document.removeEventListener('mousedown', onDocMouseDown, true);
  document.removeEventListener('keydown', onDocKeyDown, true);
}
function onDocMouseDown(e) {
  if (!currentPopover) return;
  if (currentPopover.contains(e.target)) return;
  if (e.target.closest && e.target.closest('.link-trigger')) return;
  closeLinkPopover();
}
function onDocKeyDown(e) { if (e.key === 'Escape') closeLinkPopover(); }

function openLinkPopover(anchorBtn, onInsert) {
  if (currentPopover) closeLinkPopover();
  let presetText = '';
  const activeEl = document.activeElement;
  if (activeEl && activeEl.classList && activeEl.classList.contains('te-cell')) {
    const s = activeEl.selectionStart ?? 0;
    const e = activeEl.selectionEnd ?? 0;
    if (s !== e) presetText = activeEl.value.slice(s, e);
  }
  const textInput = el('input', { type:'text', class:'input', placeholder: t('linkTextPlaceholder'), value: presetText });
  const urlInput  = el('input', { type:'text', class:'input', placeholder: t('linkUrlPlaceholder') });

  /* 页面快速选择 */
  const pageSelect = el('select', { class:'input select' });
  pageSelect.append(el('option', { value:'' }, t('selectPageOptional')));
  state.pages.forEach(p => {
    if (p.id === state.currentPageId) return;
    pageSelect.append(el('option', { value: p.slug }, `${p.title}  (${p.slug})`));
  });
  pageSelect.addEventListener('change', () => {
    const v = pageSelect.value;
    if (v) urlInput.value = v;
  });

  const pop = el('div', { class:'link-pop' },
    el('label', { class:'link-field' }, t('linkText'), textInput),
    el('label', { class:'link-field' }, t('linkUrl'), urlInput),
    el('label', { class:'link-field' }, t('linkToPage'), pageSelect),
    el('div', { class:'link-hint' },
      t('linkHintPre'), el('code', {}, '#heading'),
      t('linkHintMid'), el('code', {}, 'page-slug'),
      t('linkHintPost')
    ),
    el('div', { class:'link-actions' },
      el('button', { class:'btn tiny', type:'button', onClick: closeLinkPopover }, t('cancel')),
      el('button', {
        class:'btn tiny primary', type:'button',
        onClick: () => {
          const text = textInput.value.trim();
          const url = urlInput.value.trim();
          if (!url) { toast(t('linkNeedUrl')); urlInput.focus(); return; }
          if (onInsert(text, url)) closeLinkPopover();
        },
      }, t('insert'))
    )
  );

  document.body.append(pop);
  currentPopover = pop;

  const rect = anchorBtn.getBoundingClientRect();
  const popRect = pop.getBoundingClientRect();
  let left = rect.left, top = rect.bottom + 6;
  if (left + popRect.width > window.innerWidth - 8) left = window.innerWidth - popRect.width - 8;
  if (top + popRect.height > window.innerHeight - 8) top = rect.top - popRect.height - 6;
  if (left < 8) left = 8;
  if (top < 8) top = 8;
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';

  textInput.focus();
  textInput.select();

  setTimeout(() => {
    document.addEventListener('mousedown', onDocMouseDown, true);
    document.addEventListener('keydown', onDocKeyDown, true);
  }, 0);

  [textInput, urlInput].forEach(inp => {
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); pop.querySelector('.link-actions .primary').click(); }
    });
  });
}

function insertLinkIntoCell(inputEl, text, url) {
  const s = inputEl.selectionStart ?? inputEl.value.length;
  const e = inputEl.selectionEnd   ?? inputEl.value.length;
  const selected = inputEl.value.slice(s, e);
  const display = text || selected || url;
  const linkMd = `[${display}](${url})`;
  inputEl.value = inputEl.value.slice(0, s) + linkMd + inputEl.value.slice(e);
  inputEl.dispatchEvent(new Event('input', { bubbles: true }));
  inputEl.focus();
  const pos = s + linkMd.length;
  inputEl.setSelectionRange(pos, pos);
}

let previewTimer = null;
const previewEl   = $('#preview');
const blockListEl = $('#blockList');
const paletteEl   = $('#palette');

function schedulePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => { renderPreview(); persistAll(); }, 100);
}

const PAGES_KEY = 'md-generator:pages';
const CURRENT_PAGE_KEY = 'md-generator:currentPageId';
const THEME_KEY = 'md-generator:theme';

function persistAll() {
  try {
    localStorage.setItem(PAGES_KEY, JSON.stringify(state.pages));
    localStorage.setItem(CURRENT_PAGE_KEY, String(state.currentPageId));
  } catch (_) {}
}

function loadFromStorage() {
  try {
    const pagesRaw = localStorage.getItem(PAGES_KEY);
    if (pagesRaw) {
      const data = JSON.parse(pagesRaw);
      if (Array.isArray(data) && data.length) {
        state.pages = [];
        state.pageSeq = 0;
        state.seq = 0;
        data.forEach(raw => {
          const p = normalizePage(raw);
          if (p) {
            state.pages.push(p);
            state.pageSeq = Math.max(state.pageSeq, p.id);
          }
        });
        if (state.pages.length) {
          const savedCur = Number(localStorage.getItem(CURRENT_PAGE_KEY));
          if (state.pages.some(p => p.id === savedCur)) state.currentPageId = savedCur;
          else state.currentPageId = state.pages[0].id;
          return true;
        }
      }
    }

    /* 迁移旧版单页数据 */
    const oldRaw = localStorage.getItem('md-generator:blocks');
    if (oldRaw) {
      const oldBlocks = JSON.parse(oldRaw);
      if (Array.isArray(oldBlocks) && oldBlocks.length) {
        const page = {
          id: 1,
          title: t('restoredPageTitle'),
          slug: 'restored-page',
          blocks: oldBlocks.map(normalizeBlock).filter(Boolean),
        };
        state.pages = [page];
        state.pageSeq = 1;
        state.seq = page.blocks.reduce((m, b) => Math.max(m, b.id), 0);
        state.currentPageId = 1;
        localStorage.removeItem('md-generator:blocks');
        return true;
      }
    }
  } catch (e) { console.warn('load failed:', e); }
  return false;
}

function renderPageBar() {

  sel.innerHTML = '';
  state.pages.forEach(p => {

function renderBlockList() {

function renderBlockCard(block, index) {
  const def = COMPONENTS[block.type] || COMPONENTS.unknown;
  const isUnknown = block.type === 'unknown';
  const ctx = {
    update(patch) { Object.assign(block.data, patch); state.userEdited = true; schedulePreview(); },
    touch() { state.userEdited = true; schedulePreview(); },
    rerender() { state.userEdited = true; renderBlockList(); schedulePreview(); },
  };
  return el('div', { class:'card' + (isUnknown ? ' card-unknown' : ''), 'data-id': block.id },
    el('div', { class:'card-head' },
      el('span', { class:'card-badge' }, def.icon),

        isUnknown ? null : el('button', { class:'btn-icon', type:'button', title:t('moveDown'), onClick: () => moveBlock(index, 1) }, '↓'),
        el('button', { class:'btn-icon danger', type:'button', title:t('delete'), onClick: () => removeBlock(index) }, '✕')
      )
    ),
    el('div', { class:'card-body' }, def.editor(block, ctx))
  );

function addBlock(type) {
  const def = COMPONENTS[type];
  if (!def) return;
  const page = currentPage();
  if (!page) return;
  const block = { id: ++state.seq, type, data: def.create() };
  page.blocks.push(block);
  state.userEdited = true;
  renderBlockList();
  schedulePreview();
  requestAnimationFrame(() => {
    const card = blockListEl.querySelector(`.card[data-id="${block.id}"]`);
    if (!card) return;
    card.scrollIntoView({ behavior:'smooth', block:'nearest' });
    const firstInput = card.querySelector('input, textarea, select');
    if (firstInput) firstInput.focus();
  });
}

function removeBlock(index) {
  const page = currentPage();
  if (!page) return;
  page.blocks.splice(index, 1);
  state.userEdited = true;
  renderBlockList();
  schedulePreview();
}

function moveBlock(index, delta) {
  const page = currentPage();
  if (!page) return;
  const target = index + delta;
  if (target < 0 || target >= page.blocks.length) return;
  const [block] = page.blocks.splice(index, 1);
  page.blocks.splice(target, 0, block);
  state.userEdited = true;
  renderBlockList();
  schedulePreview();
}

/* ---------- 11. Markdown 生成 ---------- */
function buildMarkdown() {
  const page = currentPage();
  if (!page) return '';
  const parts = [];
  page.blocks.forEach(block => {
    const def = COMPONENTS[block.type];
    if (!def || typeof def.toMarkdown !== 'function') return;
    let out;
    try { out = def.toMarkdown(block); }
    catch (err) { console.warn('toMarkdown failed:', block.type, err); return; }
    if (out == null) return;
    out = String(out).trim();
    if (out) parts.push(out);
  });
  return parts.join('\n\n');
}

/* ---------- 12. 预览渲染（三级兜底） ---------- */
function admonitionMeta() {
  return {
    note:{ icon:'💡', label:t('admNote') },
    tip:{ icon:'✨', label:t('admTip') },
    important:{ icon:'📌', label:t('admImportant') },
    warning:{ icon:'⚠️', label:t('admWarning') },
    caution:{ icon:'🛑', label:t('admCaution') },
  };
}
const ALERT_RE = /\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]/i;

function stripLeadingText(root, prefixLength) {
  let remaining = prefixLength, skipping = true;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let node;
  while (remaining > 0 && (node = walker.nextNode())) {
    let text = node.nodeValue || '';
    if (skipping) {
      const lead = text.match(/^\s*/)[0].length;
      text = text.slice(lead);
      node.nodeValue = text;
      skipping = false;
    }
    if (!text) continue;
    const take = Math.min(remaining, text.length);
    node.nodeValue = text.slice(take);
    remaining -= take;
  }
}

function transformAlerts(container) {
  const meta = admonitionMeta();
  Array.from(container.querySelectorAll('blockquote')).forEach(bq => {
    const firstP = bq.querySelector('p');
    if (!firstP) return;
    const textContent = firstP.textContent || '';
    const match = textContent.match(ALERT_RE);
    if (!match) return;
    const idx = textContent.indexOf(match[0]);
    if (idx < 0) return;
    if (textContent.slice(0, idx).trim() !== '') return;
    const kind = match[1].toLowerCase();
    const m = meta[kind] || meta.note;
    stripLeadingText(firstP, idx + match[0].length);
    if (!firstP.textContent.trim() && firstP.children.length === 0) firstP.remove();
    const body = el('div', { class:'admonition-body' });
    while (bq.firstChild) body.append(bq.firstChild);
    const titleEl = el('div', { class:'admonition-title' },
      el('span', {}, m.icon), el('span', {}, m.label)
    );
    const wrap = el('div', { class:`admonition ${kind}` }, titleEl, body);
    bq.replaceWith(wrap);
  });
}

function addHeadingIds(container) {
  container.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(h => {
    if (h.id) return;
    const id = slugify(h.textContent || '');
    if (id) h.id = id;
  });
}

function highlightCode(container) {
  if (typeof hljs === 'undefined') return;
  container.querySelectorAll('pre code:not(.language-mermaid)').forEach(block => {
    try { hljs.highlightElement(block); } catch (_) {}
  });
}

function decorateLinks(container) {
  container.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href') || '';
    if (/^https?:\/\//i.test(href) || /^mailto:/i.test(href)) {
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener noreferrer');
      return;
    }
    a.addEventListener('click', (e) => {
      e.preventDefault();
      if (href.startsWith('#')) {
        scrollToAnchor(href.slice(1));
        return;
      }
      let pageRef = href, anchor = '';
      const hashIdx = href.indexOf('#');
      if (hashIdx >= 0) { pageRef = href.slice(0, hashIdx); anchor = href.slice(hashIdx + 1); }
      pageRef = pageRef.replace(/\.md$/i, '');
      const targetPage = resolvePageByRef(pageRef);
      if (!targetPage) { toast(t('pageNotFound') + ': ' + pageRef); return; }
      if (targetPage.id === state.currentPageId) {
        if (anchor) scrollToAnchor(anchor);
        return;
      }
      switchPage(targetPage.id, anchor);
    });
  });
}

/* Mermaid 渲染 */
function renderMermaidBlocks(container) {
  if (typeof window.mermaid === 'undefined') return;
  const blocks = container.querySelectorAll('pre code.language-mermaid');
  if (!blocks.length) return;

  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  try {
    window.mermaid.initialize({
      startOnLoad: false,
      theme: isDark ? 'dark' : 'default',
      securityLevel: 'loose',
    });
  } catch (_) {}

  blocks.forEach(async (codeEl) => {
    const code = codeEl.textContent || '';
    const preEl = codeEl.closest('pre');
    if (!preEl) return;
    const id = 'mmd-' + Math.random().toString(36).slice(2, 10);
    try {
      const { svg } = await window.mermaid.render(id, code);
      if (!preEl.isConnected) return;
      const wrap = el('div', { class:'mermaid-rendered', html: svg });
      preEl.replaceWith(wrap);
    } catch (err) {
      console.warn('mermaid render failed:', err);
      if (!preEl.isConnected) return;
      const errEl = el('div', {
        class:'hint',
        style:'color:var(--danger);font-size:12px;padding:4px 0;',
      }, '⚠️ Mermaid: ' + (err.message || 'render failed'));
      preEl.parentNode.insertBefore(errEl, preEl.nextSibling);
    }
  });
}

function safeParse(md) {
  if (typeof md !== 'string') md = String(md ?? '');
  if (!md.trim()) return '';
  if (typeof marked === 'undefined' || typeof marked.parse !== 'function') {
    return {
      html: `<div class="preview-fallback">
               <div class="fallback-note">${escapeHtml(t('previewFallbackLib'))}</div>
               <pre>${escapeHtml(md)}</pre>
             </div>`,
      ok: false,
    };
  }
  try {
    const html = marked.parse(md, { gfm: true, breaks: false });
    if (typeof html === 'string' && html.length) return { html, ok: true };
  } catch (e1) { console.warn('[safeParse] attempt 1 failed:', e1); }
  try {
    const cleaned = md.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
    const html = marked.parse(cleaned, { gfm: true, breaks: false });
    if (typeof html === 'string' && html.length) return { html, ok: true };
  } catch (e2) { console.warn('[safeParse] attempt 2 failed:', e2); }
  try {
    if (typeof marked === 'function') {
      const html = marked(md);
      if (typeof html === 'string' && html.length) return { html, ok: true };
    }
  } catch (e3) { console.warn('[safeParse] attempt 3 failed:', e3); }
  return {
    html: `<div class="preview-fallback">
             <div class="fallback-note">${escapeHtml(t('previewFallbackNote'))}</div>
             <pre>${escapeHtml(md)}</pre>
           </div>`,
    ok: false,
  };
}

function renderPreview() {
  const md = buildMarkdown();
  if (!md.trim()) {
    previewEl.innerHTML = `<div class="preview-empty">${escapeHtml(t('previewEmpty'))}</div>`;
    return;
  }
  const { html, ok } = safeParse(md);
  if (!ok) {
    previewEl.innerHTML = html;
    return;
  }
  previewEl.innerHTML = html;
  addHeadingIds(previewEl);
  transformAlerts(previewEl);
  highlightCode(previewEl);
  decorateLinks(previewEl);
  renderMermaidBlocks(previewEl);
}

let guideOverlayEl = null;
function buildGuide() {
  const body = $('#guideBody');

  body.innerHTML = '';

  data.forEach(section => {

      itemEl.append(el('pre', { class:'guide-item-code' }, item.code));
      const resultEl = el('div', { class:'markdown-body guide-item-result' });
      const { html, ok } = safeParse(item.code);
      if (ok) {
        resultEl.innerHTML = html;
        try {
          addHeadingIds(resultEl);
          transformAlerts(resultEl);
          highlightCode(resultEl);
          decorateLinks(resultEl);
          renderMermaidBlocks(resultEl);
        } catch (e) { console.warn(e); }
      } else {
        resultEl.textContent = item.code;
      }
      itemEl.append(resultEl);
      secEl.append(itemEl);

    body.append(secEl);

/* ---------- 14. 底部操作 ---------- */
async function copyMarkdown() {
  const md = buildMarkdown();
  if (!md.trim()) { toast(t('nothingToCopy')); return; }
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(md);
    } else { throw new Error('clipboard'); }
  } catch (_) {
    const ta = document.createElement('textarea');
    ta.value = md;
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.append(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    ta.remove();
  }
  toast(t('copied'));
}

function downloadMarkdown() {
  const md = buildMarkdown();
  if (!md.trim()) { toast(t('nothingToDownload')); return; }
  const page = currentPage();
  const base = (page && (page.slug || slugifyAscii(page.title) || ('page-' + page.id))) || 'README';
  const blob = new Blob([md], { type:'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = base + '.md';
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast(t('downloaded'));
}

function clearAll() {
  const page = currentPage();
  if (!page) return;
  if (!page.blocks.length) { toast(t('alreadyEmpty')); return; }
  if (!window.confirm(t('confirmClear'))) return;
  page.blocks = [];
  state.userEdited = true;
  renderBlockList();
  renderPreview();
  persistAll();
  toast(t('cleared'));
}

/* ---------- 15. 主题 & 语言 ---------- */
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = $('#themeToggle');
  if (btn) {
    btn.textContent = theme === 'dark' ? '☀️' : '🌙';
    btn.title = theme === 'dark' ? t('themeLight') : t('themeDark');
  }
  try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
}
function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (_) {}
  let prefersDark = false;
  try { prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (_) {}
  applyTheme(saved || (prefersDark ? 'dark' : 'light'));
}

function updateChromeText() {
  document.documentElement.setAttribute('lang', state.lang === 'zh' ? 'zh-CN' : 'en');
  document.title = t('appTitle');
  const brand = $('#brandName'); if (brand) brand.textContent = t('brandName');
  const label = $('#previewLabel'); if (label) label.textContent = t('preview');
  const copy = $('#btnCopy'); if (copy) copy.textContent = t('copy');
  const dl = $('#btnDownload'); if (dl) dl.textContent = t('download');
  const clr = $('#btnClear'); if (clr) clr.textContent = t('clear');
  const langBtn = $('#langToggle');
  if (langBtn) { langBtn.textContent = state.lang === 'zh' ? 'EN' : '中'; langBtn.title = t('langToggle'); }
  const guideBtn = $('#guideBtn'); if (guideBtn) guideBtn.title = t('guideBtnTitle');
  const guideTitle = $('#guideTitle'); if (guideTitle) guideTitle.textContent = t('guideTitle');
  const themeBtn = $('#themeToggle');
  if (themeBtn) {
    const cur = document.documentElement.getAttribute('data-theme');
    themeBtn.title = cur === 'dark' ? t('themeLight') : t('themeDark');
  }
  const newPageBtn = $('#btnNewPage'); if (newPageBtn) newPageBtn.textContent = '＋ ' + t('newPage');
  const renameBtn = $('#btnRenamePage'); if (renameBtn) renameBtn.title = t('renamePage');
  const delBtn = $('#btnDeletePage'); if (delBtn) delBtn.title = t('deletePage');
}

function applyLanguage() {
  saveLang();
  updateChromeText();
  if (!state.userEdited) {
    state.pages = [];
    state.seq = 0;
    state.pageSeq = 0;
    seedDefault();
    state.currentPageId = state.pages[0].id;
  }
  renderPalette();
  renderPageBar();
  renderBlockList();
  renderPreview();
  if (isGuideOpen()) buildGuide();
}
function toggleLanguage() {
  state.lang = state.lang === 'zh' ? 'en' : 'zh';
  applyLanguage();
}

/* ---------- 16. 初始化 ---------- */
function seedDefault() {
  const page1 = {
    id: ++state.pageSeq,
    title: t('sampleTitle'),
    slug: 'my-document',
    blocks: [],
  };
  const pushBlock = (page, type, data) => {
    const def = COMPONENTS[type];
    page.blocks.push({ id: ++state.seq, type, data: Object.assign(def.create(), data) });
  };
  pushBlock(page1, 'heading', { level: 1, text: t('sampleTitle') });
  pushBlock(page1, 'paragraph', { text: t('sampleParagraph') });
  pushBlock(page1, 'admonition', { kind:'tip', text: t('sampleTip') });
  pushBlock(page1, 'code', { lang:'javascript', code: "console.log('Hello, Markdown!');" });

  state.pages = [page1];
  state.currentPageId = page1.id;
}

function renderPalette() {
  paletteEl.innerHTML = '';
  TOOLBAR.forEach(type => {
    const def = COMPONENTS[type];
    if (!def) return;
    paletteEl.append(
      el('button', {
        class:'pal-btn', type:'button',
        title: t('addComponent').replace('{name}', t(def.type)),
        onClick: () => addBlock(type),
      },
        el('span', { class:'ico' }, def.icon),
        t(def.type)
      )
    );
  });
}

function bindEvents() {
  $('#themeToggle').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    applyTheme(cur === 'dark' ? 'light' : 'dark');
    /* Mermaid 主题需要重新渲染 */
    renderPreview();
  });
  $('#langToggle').addEventListener('click', toggleLanguage);

  const guideBtn = $('#guideBtn');
  if (guideBtn) guideBtn.addEventListener('click', openGuide);
  const guideCloseBtn = $('#guideClose');
  if (guideCloseBtn) guideCloseBtn.addEventListener('click', closeGuide);
  const overlay = $('#guideOverlay');
  if (overlay) {
    overlay.addEventListener('click', e => { if (e.target === overlay) closeGuide(); });
  }

  $('#btnCopy').addEventListener('click', copyMarkdown);
  $('#btnDownload').addEventListener('click', downloadMarkdown);
  $('#btnClear').addEventListener('click', clearAll);

  /* 页面栏 */
  const pageSelect = $('#pageSelect');
  if (pageSelect) {
    pageSelect.addEventListener('change', () => {
      const pid = Number(pageSelect.value);
      if (pid) switchPage(pid);
    });
  }

  const newPageBtn = $('#btnNewPage');
  if (newPageBtn) {
    newPageBtn.addEventListener('click', () => {
      const title = window.prompt(t('newPagePrompt'), t('newPageDefault'));
      if (!title) return;
      const ascii = slugifyAscii(title);
      let slug = ascii || ('page-' + (state.pageSeq + 1));
      /* 避免 slug 冲突 */
      let n = 1;
      const base = slug;
      while (state.pages.some(p => p.slug === slug)) { slug = base + '-' + (++n); }
      const page = { id: ++state.pageSeq, title: title.trim(), slug, blocks: [] };
      state.pages.push(page);
      state.currentPageId = page.id;
      state.userEdited = true;
      persistAll();
      renderPageBar();
      renderBlockList();
      renderPreview();
      toast(t('pageCreated'));
    });
  }

  const renameBtn = $('#btnRenamePage');
  if (renameBtn) {
    renameBtn.addEventListener('click', () => {
      const page = currentPage();
      if (!page) return;
      const newTitle = window.prompt(t('renamePagePrompt'), page.title);
      if (!newTitle || !newTitle.trim()) return;
      page.title = newTitle.trim();
      /* 同时更新 slug(如果新的 title 能生成) */
      const ascii = slugifyAscii(page.title);
      if (ascii) {
        let slug = ascii, n = 1;
        while (state.pages.some(p => p.id !== page.id && p.slug === slug)) { slug = ascii + '-' + (++n); }
        page.slug = slug;
      }
      state.userEdited = true;
      persistAll();
      renderPageBar();
      toast(t('pageRenamed'));
    });
  }

  const deleteBtn = $('#btnDeletePage');
  if (deleteBtn) {
    deleteBtn.addEventListener('click', () => {
      if (state.pages.length <= 1) { toast(t('cannotDeleteLastPage')); return; }
      const page = currentPage();
      if (!page) return;
      if (!window.confirm(t('confirmDeletePage'))) return;
      const idx = state.pages.findIndex(p => p.id === page.id);
      state.pages.splice(idx, 1);
      state.currentPageId = state.pages[Math.min(idx, state.pages.length - 1)].id;
      state.userEdited = true;
      persistAll();
      renderPageBar();
      renderBlockList();
      renderPreview();
      toast(t('pageDeleted'));
    });
  }

  window.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      downloadMarkdown();
      return;
    }
    if (e.key === 'Escape' && isGuideOpen()) closeGuide();
  });
}

function init() {
  if (typeof hljs !== 'undefined') {
    try { hljs.configure({ ignoreUnescapedHTML: true }); } catch (_) {}
  }
  updateChromeText();
  const hasSaved = loadFromStorage();
  if (hasSaved) state.userEdited = true;
  else seedDefault();

  renderPalette();
  renderPageBar();
  renderBlockList();
  renderPreview();

  bindEvents();
  initTheme();
}

init();
</script>
</body>
</html>
